spring:
  application:
    name: API-Gateway-Spring-Cloud-Gateway
  cloud:
    gateway:
#      # Настройки CORS (чтобы фронтенд с другого порта мог делать запросы)
#      globalcors:
#        cors-configurations:
#          '[/**]':
#            allowedOrigins: "*"
#            allowedMethods: "*"
#            allowedHeaders: "*"

      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
             # Для обрезания пути /api/auth/login станет /login в auth-service.
            - StripPrefix=2

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
            # Сделать фильтр StripPrefix


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8080
